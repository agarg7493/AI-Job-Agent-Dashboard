name: Sync approved Google Sheet jobs to public dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-google-sheet.yml
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: public-dashboard-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/626121433958/locations/global/workloadIdentityPools/github-job-agent-pool/providers/github-actions
          service_account: job-agent-dashboard-reader@ai-job-search-agent-512621.iam.gserviceaccount.com
      - name: Read Google Sheet and generate public-only feed
        run: |
          python -m pip install google-auth requests
          python scripts/sync_google_sheet.py
      - name: Commit feed only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified public job feed from Google Sheet"
            git push
          fi
